name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish Python wheels to PyPI (trusted publishing)
        type: boolean
        default: false
      publish_docker:
        description: Push container image to ghcr.io
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: python
          path: dist/

  pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
    needs: python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      - name: Build fuseshot.exe
        shell: bash
        run: |
          echo "from fuseshot.__main__ import main; main()" > fuseshot-app.py
          uv run --with pyinstaller pyinstaller --noconfirm --name fuseshot --collect-data fuseshot \
            --collect-all pi_heif fuseshot-app.py
          cp LICENSE THIRD_PARTY.md README.md dist/fuseshot/
          dist/fuseshot/fuseshot.exe --version
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/fuseshot -DestinationPath "fuseshot-${{ github.ref_name }}-windows.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: fuseshot-*-windows.zip

  docker:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_docker)
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name == 'workflow_dispatch'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ github.event_name == 'workflow_dispatch' && steps.meta.outputs.tags || format('fuseshot:{0}', github.ref_name) }}
          labels: ${{ github.event_name == 'workflow_dispatch' && steps.meta.outputs.labels || '' }}

  github-release:
    if: github.event_name == 'push'
    needs: [python, windows, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets/
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          draft: true